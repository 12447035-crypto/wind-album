<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>風のオムニバスアルバム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="wall">
    <!-- ===== 選ぶ画面（3Dカバーフロー） ===== -->
    <h1 id="cf-maketitle">思い出の風を、集めてみよう。</h1>
    <p id="cf-makesub">気になった風を聴いて、5つ選びましょう。<br>あなただけの風のアルバムができあがります。</p>

    <div id="coverflow">
      <div id="cf-scene">
        <div id="cf-stage">
          <img src="img/北風.png"     data-name="北風"     alt="北風">
          <img src="img/山風.png"     data-name="山風"     alt="山風">
          <img src="img/海風.png"     data-name="海風"     alt="海風">
          <img src="img/川風.png"     data-name="川風"     alt="川風">
          <img src="img/潮風.png"     data-name="潮風"     alt="潮風">
          <img src="img/向かい風.png" data-name="向かい風" alt="向かい風">
          <img src="img/追い風.png"   data-name="追い風"   alt="追い風">
          <img src="img/熱風.png"     data-name="熱風"     alt="熱風">
          <img src="img/野風.png"     data-name="野風"     alt="野風">
          <img src="img/清風.png"     data-name="清風"     alt="清風">
          <img src="img/そよ風.png"   data-name="そよ風"   alt="そよ風">
          <img src="img/biru.png"     data-name="ビル風"   alt="ビル風">
          <img src="img/雨風.png"     data-name="雨風"     alt="雨風">
          <img src="img/朝風.png"     data-name="朝風"     alt="朝風">
          <img src="img/夕風.png"     data-name="夕風"     alt="夕風">
          <img src="img/夜風.png"     data-name="夜風"     alt="夜風">
          <img src="img/春風.png"     data-name="春風"     alt="春風">
          <img src="img/花風.png"     data-name="花風"     alt="花風">
          <img src="img/春一番.png"   data-name="春一番"   alt="春一番">
          <img src="img/木の芽風.png" data-name="木の芽風" alt="木の芽風">
          <img src="img/青嵐.png"     data-name="青嵐"     alt="青嵐">
          <img src="img/若葉風.png"   data-name="若葉風"   alt="若葉風">
          <img src="img/黒南風.png"   data-name="黒南風"   alt="黒南風">
          <img src="img/涼風.png"     data-name="涼風"     alt="涼風">
          <img src="img/初嵐.png"     data-name="初嵐"     alt="初嵐">
          <img src="img/秋風.png"     data-name="秋風"     alt="秋風">
          <img src="img/悲風.png"     data-name="悲風"     alt="悲風">
          <img src="img/寒風.png"     data-name="寒風"     alt="寒風">
          <img src="img/木枯らし.png" data-name="木枯らし" alt="木枯らし">
          <img src="img/隙間風.png"   data-name="隙間風"   alt="隙間風">
        </div>
      </div>
      <div id="cf-label"></div>
    </div>

    <!-- コントロール -->
    <div id="cf-controls">
      <div id="cf-now">
        <div id="cf-detail-name">—</div>
        <div id="cf-detail-desc">—</div>
      </div>

      <div id="cf-detail-player">
        <button id="cf-play" aria-label="試聴">
          <svg viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="25"></circle>
            <polygon class="cf-play-icon" points="20,16 20,36 38,26"></polygon>
            <g class="cf-pause-icon">
              <rect x="19" y="17" width="5" height="18"></rect>
              <rect x="28" y="17" width="5" height="18"></rect>
            </g>
          </svg>
        </button>
        <div id="cf-progress">
          <div id="cf-progress-fill"></div>
          <div id="cf-progress-knob"></div>
        </div>
      </div>

      <button id="cf-add">add</button>

      <div id="cf-slots"></div>

      <button id="cf-confirm">アルバムを完成させる</button>
    </div>

    <audio id="cf-audio"></audio>
  </div>

  <!-- ===== ロード画面 ===== -->
  <div id="album-loading">
    <div class="al-spinner"></div>
    <div class="al-text">あなたの風を集めています…</div>
  </div>
  
  <div id="album-screen">

    <div id="as-deck">
      <!-- 完成画面の再生用の音声 -->
      <audio id="as-audio"></audio>

      <!-- 左：CD -->
      <div id="as-disc-wrap">
        <div id="as-disc-rot">
          <div id="as-disc-canvas"></div>
        </div>
        <input id="as-title" type="text" value="" size="8" placeholder="タイトル入力。" title="クリックでタイトルを編集（停止中のみ）">
        <div id="as-hole"></div>
      </div>

      <!-- 右：曲リストパネル -->
      <div id="as-panel">
        <!-- 再生中の曲＋説明 -->
        <div id="as-nowcard">
          <div id="as-now">
            <div id="as-swatch"></div>
            <div id="as-info">
              <div id="as-name">そよ風</div>
              <div id="as-num">トラック 1 / 5</div>
            </div>
          </div>
          <div id="as-desc">—</div>
        </div>
      </div>

      <!-- 下：プログレスバー -->
      <div id="as-progwrap">
        <div id="as-prog"><div id="as-fill"></div><div id="as-knob"></div></div>
      </div>

      <!-- 下：立体ボタン（曲の戻る/再生/次へ） -->
      <div id="as-ctrl">
        <div class="as-btn-wrap">
          <button id="as-prev" aria-label="前の曲"></button>
          <span class="as-btn-label">◀|</span>
        </div>
        <div class="as-btn-wrap">
          <button id="as-play" aria-label="再生/一時停止"></button>
          <span class="as-btn-label"><span class="ic-play">▶</span><span class="ic-pause">❚❚</span></span>
        </div>
        <div class="as-btn-wrap">
          <button id="as-next" aria-label="次の曲"></button>
          <span class="as-btn-label">|▶</span>
        </div>
      </div>

      <!-- 音量ダイヤル -->
      <div id="as-vol" title="ドラッグで音量調整">
        <div id="as-vol-dial">
          <div id="as-vol-mark"></div>
        </div>
        <div id="as-vol-label">VOL</div>
      </div>

      <!-- 画面送り：左=前の画面に戻る / 右=次の画面（QR完成）へ -->
      <button id="as-screen-prev" aria-label="前の画面に戻る">
        <svg viewBox="0 0 60 40" width="60" height="40">
          <polyline points="34,8 18,20 34,32"></polyline>
          <polyline points="48,8 32,20 48,32"></polyline>
        </svg>
      </button>
      <button id="as-screen-next" aria-label="スマホに保存" disabled>
        <span class="next-ring">
          <svg viewBox="0 0 48 48" width="34" height="34">
            <rect class="phone-body" x="16" y="21" width="16" height="22" rx="3.5"></rect>
            <line class="phone-line" x1="22" y1="25" x2="26" y2="25"></line>
            <polyline class="down-arrow" points="19,11 24,16 29,11"></polyline>
            <line class="down-arrow" x1="24" y1="5" x2="24" y2="16"></line>
          </svg>
        </span>
      </button>

      <span id="as-time">0:00 / 0:00</span>
      <div id="as-tracklist"></div>
    </div>

    <!-- QRオーバーレイ（次へ で枠の中央に被さる・アルバム完成） -->
    <div id="as-qr-overlay">
      <div id="as-qr-card">
        <div id="as-qr-title">あなたのアルバムが完成しました</div>
        <div id="as-qr"></div>
        <div id="as-qr-sub">QRコードを読み取って<br>スマホに保存</div>
      </div>
    </div>
  </div>

  <!-- ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
